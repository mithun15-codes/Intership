<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messages • Instagram</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <nav class="top-nav" id="top-nav" style="border-bottom: none;"></nav>

  <main class="page" style="padding-bottom: 0;">
    <div class="messages-layout">
      
      <!-- Sidebar / Conversation List -->
      <aside class="messages-sidebar">
        <div class="messages-sidebar__header">
          <h2 id="current-username-display">Username</h2>
          <button class="messages-sidebar__new-btn" aria-label="New message">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          </button>
        </div>
        
        <div class="messages-tabs">
          <div class="messages-tab active">Primary</div>
          <div class="messages-tab">General</div>
          <div class="messages-tab">Requests</div>
        </div>

        <div class="messages-list" id="conversations-list">
          <!-- Rendered by JS -->
        </div>
      </aside>

      <!-- Active Chat Area -->
      <section class="messages-chat" id="chat-area">
        <!-- Rendered by JS / Hidden by default on mobile until selected -->
        <div class="messages-chat__empty">
          <div class="messages-chat__empty-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>
          </div>
          <h3>Your messages</h3>
          <p>Send private photos and messages to a friend or group.</p>
          <button onclick="showToast('Open new message modal')">Send message</button>
        </div>
      </section>

    </div>
  </main>

  <nav class="bottom-nav" id="bottom-nav"></nav>

  <script src="js/data.js?v=13"></script>
  <script src="js/app.js?v=13"></script>
  <script src="js/messages.js?v=13"></script>
</body>
</html>
